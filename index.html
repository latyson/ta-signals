<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>TA Signals</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0a0e16; --bg2:#111827; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.10); --text:#e8edf5; --muted:#8c97a9;
  --up:#16c784; --up-bg:rgba(22,199,132,.14); --down:#ef4444; --down-bg:rgba(239,68,68,.14);
  --none:#94a3b8; --warn:#f5a524; --accent:#3b82f6; --accent-text:#fff; --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 10% -10%,rgba(59,130,246,.18),transparent 60%),
             radial-gradient(900px 500px at 110% 10%,rgba(22,199,132,.12),transparent 60%),var(--bg);
  background-attachment:fixed;color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  min-height:100vh;
}
#app{max-width:560px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
.top{display:flex;align-items:center;gap:10px;padding:4px 0 12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand b{font-size:17px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.icon-btn{height:34px;min-width:34px;padding:0 10px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:600}
.steps{display:flex;gap:6px;margin-bottom:14px}
.step{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:600}
.step i{font-style:normal;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:var(--card2);font-size:11px}
.step.on{color:var(--text);border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.step.on i{background:var(--accent);color:var(--accent-text)}
.arrow{color:var(--muted);align-self:center;font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;font-weight:600}
.seg{display:flex;gap:6px;background:rgba(0,0,0,.25);padding:4px;border-radius:14px;border:1px solid var(--border)}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.asset{text-align:left;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--border)}
.asset b{display:block;font-size:15px}
.asset small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.asset.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.asset:disabled{opacity:.45}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.g{background:var(--up)}.dot.r{background:var(--down)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--accent);color:var(--accent-text);font-weight:700;font-size:16px;text-align:center;text-decoration:none}
.btn.ghost{background:var(--card);border:1px solid var(--border);color:var(--text);font-weight:600;font-size:15px}
.btn.sm{padding:10px;font-size:14px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.mt{margin-top:10px}
.note{color:var(--muted);font-size:13px}
.warn{color:var(--warn)}
.center{text-align:center}
.dir{border-radius:22px;padding:22px 16px;text-align:center;margin-bottom:12px;border:1px solid var(--border)}
.dir.up{background:linear-gradient(160deg,rgba(22,199,132,.28),rgba(22,199,132,.06));border-color:rgba(22,199,132,.45)}
.dir.down{background:linear-gradient(160deg,rgba(239,68,68,.28),rgba(239,68,68,.06));border-color:rgba(239,68,68,.45)}
.dir.none{background:var(--card)}
.dir .big{font-size:40px;font-weight:800;letter-spacing:1px;line-height:1.1}
.dir.up .big{color:var(--up)}.dir.down .big{color:var(--down)}.dir.none .big{color:var(--none);font-size:30px}
.dir .sub{color:var(--muted);margin-top:6px;font-size:13px}
.timer{display:inline-block;margin-top:12px;padding:7px 14px;border-radius:999px;background:rgba(0,0,0,.3);font-weight:700;font-variant-numeric:tabular-nums}
.timer.exp{color:var(--warn)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px}
.metric .k{color:var(--muted);font-size:11px;font-weight:600}
.metric .v{font-size:16px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;word-break:break-word}
.metric .s{color:var(--muted);font-size:11px;margin-top:2px}
.c-up{color:var(--up)}.c-down{color:var(--down)}.c-none{color:var(--none)}
.checks{margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:8px;padding:4px 0;font-size:14px}
.checks .ok{color:var(--up)}.checks .no{color:var(--down)}
.checks small{color:var(--muted)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
.pill.win{background:var(--up-bg);color:var(--up)}.pill.loss{background:var(--down-bg);color:var(--down)}
.pill.refund,.pill.pending,.pill.nodata{background:var(--card2);color:var(--muted)}
.hist-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.hist-item:last-child{border-bottom:0}
.hist-item .meta{color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:13px;color:var(--muted);font-weight:600}
.chip.on{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{text-align:center;padding:10px 4px;border-radius:14px;background:rgba(0,0,0,.2)}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.disc{font-size:12px;color:var(--muted);border-left:3px solid var(--warn);padding:8px 10px;background:rgba(245,165,36,.07);border-radius:8px;margin:12px 0}
.ai{white-space:pre-wrap;font-size:14px}
.foot{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.foot button{padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:13px;color:var(--muted);font-weight:600}
.spin{width:28px;height:28px;border:3px solid var(--card2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.how h3{margin:14px 0 6px;font-size:15px}.how p,.how li{color:#cdd5e1;font-size:14px}.how ul{padding-left:18px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2937;border:1px solid var(--border);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td{padding:6px 4px;border-bottom:1px solid var(--border)}
.pass{color:var(--up);font-weight:700}.fail{color:var(--down);font-weight:700}
.inp{width:100%;padding:11px 12px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--text);font:inherit;font-size:14px;margin-bottom:8px;outline:none}
.inp:focus{border-color:var(--accent)}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;word-break:break-all;background:rgba(0,0,0,.25);padding:8px 10px;border-radius:10px;margin:4px 0 8px}
.pair{display:inline-flex;align-items:center;flex:none}
.pair i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;border:2px solid var(--bg);color:#fff}
.pair i.p0{background:linear-gradient(140deg,#1f9d6b,#0f6e4a)}
.pair i.p1{background:linear-gradient(140deg,#3657a8,#22346b);margin-left:-9px}
.pair.lg i{width:40px;height:40px;font-size:15px}
.arow{display:flex;align-items:center;gap:10px;min-width:0}
.asset-head{display:flex;align-items:center;gap:12px}
.asset-head b{font-size:18px}
.dir-row{display:flex;align-items:center;gap:16px;text-align:left}
.orb{width:74px;height:74px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff}
.dir.up .orb{background:radial-gradient(circle at 35% 30%,#3fe0a1,#0e8a5c);box-shadow:0 0 30px rgba(22,199,132,.45)}
.dir.down .orb{background:radial-gradient(circle at 35% 30%,#ff6b6b,#b4232c);box-shadow:0 0 30px rgba(239,68,68,.45)}
.dir.none .orb{background:var(--card2);color:var(--none)}
.dir-row .timer{margin-top:6px}
.dir .instr{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:14px;text-align:left}
.metric .k svg{vertical-align:-3px;margin-right:4px;opacity:.8}
.scan-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.scan-row:last-child{border-bottom:0}
.id-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.id-row:last-child{border-bottom:0}
table.t th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:4px}
svg .su{stroke:var(--up);stroke-width:1}svg .sd{stroke:var(--down);stroke-width:1}
svg .fu{fill:var(--up)}svg .fd{fill:var(--down)}
svg .bbz{fill:rgba(59,130,246,.08)}svg .bbl{fill:none;stroke:rgba(96,165,250,.7);stroke-width:1.2;stroke-dasharray:4 3}
svg .bbm{fill:none;stroke:rgba(148,163,184,.45);stroke-width:1}svg .lastl{stroke:rgba(255,255,255,.35);stroke-width:1;stroke-dasharray:2 3}
.banner{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:10;max-width:536px;margin:0 auto;padding:12px 14px;border-radius:16px;
  background:#132a20;border:1px solid rgba(22,199,132,.55);box-shadow:0 10px 30px rgba(0,0,0,.45);display:none;align-items:center;gap:10px;font-weight:600}
.banner.down{background:#2c1416;border-color:rgba(239,68,68,.55)}
.banner.show{display:flex}.banner span{flex:1}.banner button{padding:8px 12px;border-radius:10px;background:var(--card2);font-weight:700}
@media (max-width:360px){.metrics{grid-template-columns:1fr 1fr}.dir .big{font-size:34px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <!-- Логотип: свечи + пульс (собственный, без чужих брендов) -->
      <svg width="38" height="38" viewBox="0 0 48 48" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16c784"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
        <rect width="48" height="48" rx="13" fill="url(#lg)"/>
        <rect x="10" y="20" width="6" height="14" rx="1.5" fill="#fff" opacity=".9"/><line x1="13" y1="15" x2="13" y2="38" stroke="#fff" stroke-width="2" opacity=".9"/>
        <rect x="21" y="13" width="6" height="12" rx="1.5" fill="#fff"/><line x1="24" y1="9" x2="24" y2="30" stroke="#fff" stroke-width="2"/>
        <rect x="32" y="22" width="6" height="10" rx="1.5" fill="#fff" opacity=".75"/><line x1="35" y1="18" x2="35" y2="36" stroke="#fff" stroke-width="2" opacity=".75"/>
      </svg>
      <div><b id="appName"></b><small id="tagline"></small></div>
    </div>
    <button class="icon-btn" id="btnHelp" title="Help">💬</button>
    <button class="icon-btn" id="btnLang">EN</button>
  </header>
  <nav class="steps" id="steps"></nav>
  <main id="view"></main>
  <nav class="foot" id="foot"></nav>
</div>
<div class="toast" id="toast"></div>
<div class="banner" id="banner" role="alert"></div>

<script>
/* ═════════════════════════ НАСТРОЙКИ ═════════════════════════ */
const CONFIG = {
  APP_NAME:        "TA Signals",
  BOT_USERNAME:    "ta_signals_robot",          // без @
  APP_SHORT_NAME:  "trade228",               // короткое имя Mini App из BotFather
  ADMIN_IDS:       [861034642, 900500058],                 // ← ваш Telegram user id (число), можно несколько
  REF_URL:         "[моя реф-ссылка]",    // sub-ID добавляется параметром
  SUBID_PARAM:     "[sub_id]",            // имя параметра sub-ID из кабинета партнёрки
  PAYOUT:          0.80,                  // выплата брокера → безубыточный винрейт 1/(1+PAYOUT)
  TWELVE_DATA_KEY: "[ключ Twelve Data]",
  DEFAULT_LANG:    "ru",
  // ── добавлено ──
  SUPPORT_USERNAME: "[ник_поддержки]",    // кнопка «Помощь» → t.me/<ник>, без @
  // Ручная разблокировка: Telegram user id, которым открыты закрытые функции (админы — всегда).
  UNLOCKED_IDS:    [],                    // например [111111111, 222222222]
  LOCKED_FEATURES: ["ai", "stocks"],      // что закрыто: "ai", "stocks", "crypto", "forex_td" (GBP/JPY/AUD), "exp1", "exp3"
  // settings.json рядом с index.html переопределяет REF_URL, SUBID_PARAM, SUPPORT_USERNAME
  // и дополняет UNLOCKED_IDS — меняется на GitHub без правки кода (экран «Реф-ссылка» в админке).
  SETTINGS_URL:    "settings.json",
  WORKER_URL:      "",                    // https://….workers.dev — отправка ботом, автопостинг, мгновенная выдача доступа (README, раздел 7)
  GITHUB_REPO:     "latyson/ta-signals",                    // "логин/репозиторий" — для кнопки «Открыть settings.json на GitHub»
  AI: {
    ENABLED:  true,
    // Любой совместимый /v1/chat/completions. По умолчанию — бесплатные модели OpenRouter (суффикс :free).
    ENDPOINT: "https://openrouter.ai/api/v1/chat/completions",
    MODELS:   ["nvidia/nemotron-3.5-lightning:free", "google/gemma-4-31b-it:free", "google/gemma-4-26b-a4b-it:free"], // пробуются по очереди
    // Ключ в публичный код НЕ кладём: GitHub найдёт его, и OpenRouter отключит ключ.
    // Админ вставляет ключ в «⚙️ Админка → ИИ», он хранится только на его телефоне (README, раздел 4).
    API_KEY:  ""
  }
};

/* ═════════════════════ ЧИСТЫЕ ФУНКЦИИ (PURE-START) ═════════════════════
   indicators / signal / resolve — без DOM и сети, тестируются в ?selftest=1 */
const Indicators = {
  ema(values, period) {
    const out = new Array(values.length).fill(null);
    if (values.length < period) return out;
    let s = 0;
    for (let i = 0; i < period; i++) s += values[i];
    let prev = s / period; out[period - 1] = prev;
    const k = 2 / (period + 1);
    for (let i = period; i < values.length; i++) { prev = values[i] * k + prev * (1 - k); out[i] = prev; }
    return out;
  },
  // RSI по Уайлдеру
  rsi(closes, period = 14) {
    const out = new Array(closes.length).fill(null);
    if (closes.length <= period) return out;
    let g = 0, l = 0;
    for (let i = 1; i <= period; i++) { const d = closes[i] - closes[i - 1]; if (d > 0) g += d; else l -= d; }
    let ag = g / period, al = l / period;
    const calc = () => al === 0 ? (ag === 0 ? 50 : 100) : 100 - 100 / (1 + ag / al);
    out[period] = calc();
    for (let i = period + 1; i < closes.length; i++) {
      const d = closes[i] - closes[i - 1];
      ag = (ag * (period - 1) + (d > 0 ? d : 0)) / period;
      al = (al * (period - 1) + (d < 0 ? -d : 0)) / period;
      out[i] = calc();
    }
    return out;
  },
  // Bollinger(period, mult) по последним period закрытиям, стандартное отклонение генеральной совокупности
  bollinger(closes, period = 20, mult = 2) {
    if (closes.length < period) return null;
    const w = closes.slice(-period);
    const mid = w.reduce((a, b) => a + b, 0) / period;
    const sd = Math.sqrt(w.reduce((a, b) => a + (b - mid) ** 2, 0) / period);
    return { mid, upper: mid + mult * sd, lower: mid - mult * sd, sd };
  },
  trend(closes15, flatPct = 0.05) {
    const e20 = Indicators.ema(closes15, 20).at(-1), e50 = Indicators.ema(closes15, 50).at(-1);
    if (e20 == null || e50 == null) return null;
    const diffPct = (e20 - e50) / e50 * 100;
    return { dir: Math.abs(diffPct) < flatPct ? 'flat' : diffPct > 0 ? 'up' : 'down', e20, e50, diffPct };
  },
  // расстояние от цены до ближайшего максимума/минимума за lookback минут
  levels(c1, price, lookback = 60) {
    const w = c1.slice(-lookback);
    const hi = Math.max(...w.map(c => c.h)), lo = Math.min(...w.map(c => c.l));
    const dUp = hi - price, dDn = price - lo;
    return dUp <= dDn ? { type: 'high', level: hi, dist: dUp, hi, lo } : { type: 'low', level: lo, dist: dDn, hi, lo };
  },
  // средний абсолютный ход |close − open| по 5-минутным окнам за lookback минут
  move5(c1, lookback = 60, win = 5) {
    const w = c1.slice(-lookback), m = [];
    for (let i = 0; i + win <= w.length; i += win) m.push(Math.abs(w[i + win - 1].c - w[i].o));
    return m.length ? m.reduce((a, b) => a + b, 0) / m.length : null;
  }
};

const Signal = {
  RSI_LOW: 30, RSI_HIGH: 70,
  // c1 — закрытые 1м свечи, c15 — закрытые 15м свечи (по возрастанию времени)
  compute(c1, c15) {
    if (!c1 || c1.length < 60 || !c15 || c15.length < 50) return { dir: 'none', error: 'insufficient' };
    const closes = c1.map(c => c.c), last = c1[c1.length - 1];
    const rsi = Indicators.rsi(closes, 14).at(-1);
    const bb = Indicators.bollinger(closes, 20, 2);
    const trend = Indicators.trend(c15.map(c => c.c));
    const level = Indicators.levels(c1, last.c, 60);
    const move = Indicators.move5(c1, 60, 5);
    const checks = {
      up:   { bb: last.c < bb.lower, rsi: rsi < Signal.RSI_LOW,  trend: trend.dir !== 'down' },
      down: { bb: last.c > bb.upper, rsi: rsi > Signal.RSI_HIGH, trend: trend.dir !== 'up' }
    };
    const all = o => o.bb && o.rsi && o.trend;
    const dir = all(checks.up) ? 'up' : all(checks.down) ? 'down' : 'none';
    return { dir, close: last.c, candle: last, rsi, bb, trend, level, move, checks };
  },
  // «Перевес» для админа: направление есть всегда, но это НЕ сигнал — сила показывает, насколько он выражен
  lean(r) {
    const half = (r.bb.upper - r.bb.mid) || 1e-12;
    const score = (50 - r.rsi) / 20 + (r.bb.mid - r.close) / half + ({ up: 0.5, down: -0.5, flat: 0 }[r.trend.dir]);
    const s = Math.abs(score);
    return { dir: score >= 0 ? 'up' : 'down', score, strength: s < 0.5 ? 'weak' : s < 1.2 ? 'mid' : 'strong' };
  }
};

const Resolve = {
  outcome(dir, entry, exit) {
    if (exit === entry) return 'refund';
    return (dir === 'up') === (exit > entry) ? 'win' : 'loss';
  },
  // sig: {dir, entryT (open time свечи после сигнальной), exp (мин)}; candles — 1м свечи
  fromCandles(sig, candles) {
    const e = candles.find(c => c.t === sig.entryT);
    const x = candles.find(c => c.t === sig.entryT + (sig.exp - 1) * 60000);
    if (!e || !x) return null;
    return { entry: e.o, exit: x.c, outcome: Resolve.outcome(sig.dir, e.o, x.c) };
  }
};

function aggregate(c1, minutes) {
  const step = minutes * 60000, out = [];
  let cur = null, n = 0;
  for (const c of c1) {
    const b = Math.floor(c.t / step) * step;
    if (!cur || cur.t !== b) { if (cur && n === minutes) out.push(cur); cur = { t: b, o: c.o, h: c.h, l: c.l, c: c.c }; n = 1; }
    else { cur.h = Math.max(cur.h, c.h); cur.l = Math.min(cur.l, c.l); cur.c = c.c; n++; }
  }
  if (cur && n === minutes) out.push(cur);
  return out;
}

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function randomWalk(seed, n = 3000) {
  const rnd = mulberry32(seed);
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const out = []; let p = 100; const t0 = Date.UTC(2026, 0, 5), sig = 0.0008;
  for (let i = 0; i < n; i++) {
    const o = p, c = o * Math.exp(sig * gauss());
    const h = Math.max(o, c) * (1 + Math.abs(gauss()) * sig * 0.5), l = Math.min(o, c) * (1 - Math.abs(gauss()) * sig * 0.5);
    out.push({ t: t0 + i * 60000, o, h, l, c }); p = c;
  }
  return out;
}

// Бэктест без заглядывания вперёд: на шаге i функциям доступны только свечи ≤ i
function backtest(candles, exp = 5) {
  const c15all = aggregate(candles, 15);
  let win = 0, loss = 0, refund = 0, signals = 0, j = 0;
  for (let i = 800; i < candles.length - exp; i++) {
    const endT = candles[i].t + 60000;
    while (j < c15all.length && c15all[j].t + 900000 <= endT) j++;
    const s = Signal.compute(candles.slice(i - 99, i + 1), c15all.slice(Math.max(0, j - 100), j));
    if (s.dir === 'none') continue;
    signals++;
    const r = Resolve.fromCandles({ dir: s.dir, entryT: endT, exp }, candles.slice(i + 1, i + 1 + exp));
    if (r.outcome === 'win') win++; else if (r.outcome === 'loss') loss++; else refund++;
    i += exp; // следующая сделка — после экспирации
  }
  return { signals, win, loss, refund };
}

async function fetchJSON(url, ms = 10000) {

  try { const r = await fetch(url, { signal: ac.signal }); if (!r.ok) throw new Error('http ' + r.status); return await r.json(); }

async function binanceKlines(sym, interval, extra = {}) {
  const q = new URLSearchParams({ symbol: sym, interval, limit: '100', ...extra });
  let err;
  for (const base of BINANCE) {
    try {
      const d = await fetchJSON(`${base}/api/v3/klines?${q}`);
      if (!Array.isArray(d)) throw new Error('bad');
      const now = Date.now();
      return d.map(k => ({ t: k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4], ct: k[6] + 1 })).filter(c => c.ct <= now);
    } catch (e) { err = e; }
  }
  throw err;
}
function tdAllow() {
  const now = Date.now();
  while (tdLog.length && now - tdLog[0] > 60000) tdLog.shift();
  if (tdLog.length >= 8) return false;
  tdLog.push(now); return true;
}
const parseUTC = s => { const [d, t = '00:00:00'] = s.split(' '); const [Y, M, D] = d.split('-').map(Number); const [h, m, x] = t.split(':').map(Number); return Date.UTC(Y, M - 1, D, h, m, x || 0); };
const fmtUTC = ms => new Date(ms).toISOString().slice(0, 19).replace('T', ' ');
async function tdSeries(sym, interval, extra = {}) {
  if (!tdKeyOk()) throw new Error('nokey');
  if (!tdAllow()) throw new Error('rate');
  const q = new URLSearchParams({ symbol: sym, interval, outputsize: '100', timezone: 'UTC', apikey: CONFIG.TWELVE_DATA_KEY, ...extra });
  const d = await fetchJSON('https://api.twelvedata.com/time_series?' + q);
  if (d.status === 'error' || !Array.isArray(d.values)) throw new Error(d.message || 'td');
  const step = interval === '1min' ? 60000 : 900000, now = Date.now();
  return d.values.map(v => ({ t: parseUTC(v.datetime), o: +v.open, h: +v.high, l: +v.low, c: +v.close }))
    .filter(c => c.t + step <= now && isFinite(c.c)).sort((a, b) => a.t - b.t);
}

// расчёт по одному активу без записи в историю (используется анализом и поиском)
async function analyzeAsset(a) {
  if (!isOpen(a.cls)) return { status: 'closed', opens: nextOpen(a.cls) };
  try {
    const [c1, c15] = await Promise.all([getCandles(a, '1m'), getCandles(a, '15m')]);
    const last = c1.at(-1), maxLag = a.src === 'td' ? 240000 : 150000;
    if (!last || last.t + 60000 < Date.now() - maxLag) throw new Error('stale');
    const r = Signal.compute(c1, c15);
    if (r.error) throw new Error(r.error);
    return { status: 'ok', r, sigClose: r.candle.t + 60000, c1 };
  } catch (e) { return { status: e.message === 'rate' ? 'rate' : 'nodata' }; }
}

async function runAnalysis() {
  const a = ASSET[S.assetId], exp = S.exp;
  if (assetLocked(a) || isLocked('exp' + exp)) { S.screen = 'select'; return render(); }
  S.screen = 'signal'; S.an = { status: 'loading', assetId: a.id, exp }; render();
  const res = await analyzeAsset(a);
  if (res.status === 'closed') { S.an = { status: 'closed', assetId: a.id, exp, opens: res.opens }; return render(); }
  if (res.status !== 'ok') { S.an = { status: 'nodata', assetId: a.id, exp }; return render(); }
  {
    const { r, sigClose, c1 } = res;
    const an = { status: 'ok', assetId: a.id, exp, r, sigClose, c1, deadline: sigClose + 60000, key: a.id + sigClose + exp };
    if (r.dir !== 'none') {
      const id = Store.nextNo();
      Store.add({
        id, ts: Date.now(), assetId: a.id, name: a.name, cls: a.cls, dir: r.dir, exp,
        sigClose, entryT: sigClose, deadline: sigClose + 60000,
        close: r.close, rsi: r.rsi, trend: r.trend.dir, trendPct: r.trend.diffPct, level: r.level, move: r.move,
        status: 'pending', entry: null, exit: null, posted: false, resultPosted: false

}

/* ── подписчики бота: собираем из getUpdates (Telegram хранит апдейты 24 ч) ── */
const SUBS = { get: () => LS.get('ta_subs', []), set: v => LS.set('ta_subs', v) };
const welcomeText = () => LS.get('ta_welcome', t('welcomeDefault'));
async function syncSubscribers(silent) {
  if (!botReady()) return;
  S.subSync = 'running'; if (!silent && S.screen === 'admin') render();
  try {
    // общая база в Telegram: объединяем то, что на телефоне, с тем, что сохранил другой админ
    let remote = null;
    try { remote = await DB.load(); S.dbErr = null; } catch (e) { S.dbErr = e.message; }
    const blocked = new Set([...LS.get('ta_blocked', []), ...((remote && remote.blocked) || [])]);
    const byId = new Map();
    for (const s of [...((remote && remote.subs) || []), ...SUBS.get()]) if (!blocked.has(s.id) && !byId.has(s.id)) byId.set(s.id, s);
    const drafts = [], seen = new Set();
    for (const d of [...((remote && remote.drafts) || []), ...LS.get('ta_drafts', [])]) { const k = d.chat + ':' + d.id; if (!seen.has(k)) { seen.add(k); drafts.push(d); } }
    const sig = d => [d.subs.length, d.drafts.length, d.blocked.length].join('/');
    const before = remote ? sig({ subs: remote.subs || [], drafts: remote.drafts || [], blocked: remote.blocked || [] }) : '';
    let offset = LS.get('ta_upd_off', 0), added = 0, more = true;
    while (more) {
      const ups = await botApi('getUpdates', { offset, limit: 100, timeout: 0, allowed_updates: ['message', 'my_chat_member'] });
      for (const u of ups) {
        offset = u.update_id + 1;
        const m = u.message, cm = u.my_chat_member;
        // сообщения админа боту (кружок, голосовое, фото, видео, текст…) — черновики для рассылки
        if (m && m.chat && m.chat.type === 'private' && m.from && CONFIG.ADMIN_IDS.includes(m.from.id) && !(typeof m.text === 'string' && m.text.startsWith('/'))) {
          const kind = ['video_note', 'voice', 'photo', 'video', 'animation', 'audio', 'document', 'sticker', 'poll', 'text'].find(k => m[k]) || 'other';
          drafts.push({ chat: m.chat.id, id: m.message_id, kind, group: m.media_group_id || null, preview: String(m.text || m.caption || '').slice(0, 80), ts: m.date * 1000 });
        }
        if (m && m.chat && m.chat.type === 'private') {
          blocked.delete(m.chat.id); // снова написал боту — значит, разблокировал
          if (!byId.has(m.chat.id)) { byId.set(m.chat.id, { id: m.chat.id, name: m.chat.first_name || '', u: m.chat.username || '', ts: m.date * 1000 }); added++; }
          if (typeof m.text === 'string' && m.text.startsWith('/start')) { try { await botSend(m.chat.id, welcomeText()); } catch { } }
          if (typeof m.text === 'string' && m.text.startsWith('/stop')) { // отписка от уведомлений
            byId.delete(m.chat.id); blocked.add(m.chat.id);
            try { await botApi('sendMessage', { chat_id: m.chat.id, text: t('stopReply') }); } catch { }
          }
        }
        if (cm && cm.chat && cm.chat.type === 'private' && cm.new_chat_member && cm.new_chat_member.status === 'kicked') { byId.delete(cm.chat.id); blocked.add(cm.chat.id); }
      }
      LS.set('ta_upd_off', offset);
      more = ups.length === 100;
    }
    drafts.sort((x, y) => x.ts - y.ts);
    const data = { v: 1, subs: [...byId.values()], drafts: drafts.slice(-40), blocked: [...blocked].slice(-5000), msg: remote && remote.msg };
    SUBS.set(data.subs); LS.set('ta_drafts', data.drafts); LS.set('ta_blocked', data.blocked);
    if (sig(data) !== before && !S.dbErr) { try { await DB.save(data); } catch (e) { S.dbErr = e.message; } }
    S.subSync = { ok: true, added, at: Date.now() };
  } catch (e) { S.subSync = { error: e.code === 409 ? t('bcWebhook') : e.message }; }
  if (S.screen === 'admin') render();
}
// личное «🔔 Новый сигнал» всем подписчикам бота (если админ включил); перед отправкой учитываем свежие /stop
async function notifySubscribers(rec) {
  if (!botReady() || !LS.get('ta_notify_subs', false) || (S.bc && S.bc.running)) return;
  await syncSubscribers(true);

}
// черновики, сгруппированные в альбомы (media_group_id), новые сверху
function draftGroups() {
  const out = [];
  for (const d of LS.get('ta_drafts', [])) {
    const g = d.group && out.find(x => x.group === d.group && x.chat === d.chat);
    if (g) { g.ids.push(d.id); if (!g.preview) g.preview = d.preview; } else out.push({ key: d.chat + ':' + d.id, chat: d.chat, ids: [d.id], kind: d.kind, group: d.group, preview: d.preview, ts: d.ts });
  }
  return out.reverse().slice(0, 12);
}
// рассылка текста или копии сообщения админа (кружок/голосовое/фото/видео/альбом) — без пометки «переслано»
async function broadcast(text, draft) {
  const send = draft
    ? id => draft.ids.length > 1
      ? botApi('copyMessages', { chat_id: id, from_chat_id: draft.chat, message_ids: draft.ids.sort((x, y) => x - y) })
      : botApi('copyMessage', { chat_id: id, from_chat_id: draft.chat, message_id: draft.ids[0], reply_markup: appButton() })
    : id => botSend(id, text);
  const subs = SUBS.get().filter(s => !draft || s.id !== draft.chat);
  S.bc = { running: true, done: 0, total: subs.length, ok: 0, fail: 0 };
  const blocked = new Set();
  for (const s of subs) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try { await send(s.id); S.bc.ok++; break; }
      catch (e) {
        if (e.code === 429 && attempt === 0) { await sleep((e.retry || 1) * 1000 + 200); continue; }
        if (e.code === 403 || e.code === 400) blocked.add(s.id);
        S.bc.fail++; break;
      }
    }
    S.bc.done++;
    const el = document.getElementById('bcProgress'); if (el) el.textContent = t('bcProgress', S.bc);
    await sleep(60); // ≈15 сообщений/с — ниже лимита Telegram
  }
  if (blocked.size) {
    SUBS.set(SUBS.get().filter(s => !blocked.has(s.id)));
    LS.set('ta_blocked', [...new Set([...LS.get('ta_blocked', []), ...blocked])]);
  }
  S.bc.running = false; S.bc.removed = blocked.size;
  if (blocked.size) syncSubscribers(true); // сохранить изменения в общую базу
  if (S.screen === 'admin') render();
}

let resolving = false;
async function resolvePending(force) {
  if (resolving) return; resolving = true;
  let changed = false;
  try {
    const now = Date.now();
    for (const st of [Store, AIStore]) for (const r of st.all()) {
      if (r.status !== 'pending') continue;
      const due = r.entryT + r.exp * 60000;
      if (now < due + 3000 || (!force && r.nextTry && now < r.nextTry)) continue;
      const a = ASSET[r.assetId];
      try {
        const res = Resolve.fromCandles(r, await getRange(a, r.entryT, r.exp));
        if (res) {
          const done = st.patch(r.id, { status: res.outcome, entry: res.entry, exit: res.exit, resolvedAt: Date.now() }); changed = true;
          if (st === Store && r.id === S.currentId) haptic(res.outcome === 'win' ? 'success' : 'warning');
          if (st === Store && (done.auto || done.manual) && done.posted && botReady() && BOT.get().channel) { // итог публикуется сам
            try { await botSend(BOT.get().channel, postResultText(done), false); Store.patch(r.id, { resultPosted: true }); } catch { }
          }
        }
        else st.patch(r.id, now - due > 6 * 3600e3 ? { status: 'nodata' } : { nextTry: now + 15000 });
      } catch (e) {
        st.patch(r.id, now - due > 6 * 3600e3 ? { status: 'nodata' } : { nextTry: now + (e.message === 'rate' ? 45000 : 15000) });
      }
      changed = true;
      if (a.src === 'td') break; // бережём лимит Twelve Data
    }
  } finally { resolving = false; }
  if (changed && ['result', 'history', 'day', 'signal'].includes(S.screen)) render();
}

// ключ ИИ: из CONFIG (если сервер/прокси) или с телефона админа — в публичный код его не кладём
const aiKey = () => CONFIG.AI.API_KEY || (isAdmin ? LS.get('ta_ai_key', '') : '');
async function aiChat(sys, user) {
  const key = aiKey();
  // без ключа на устройстве — через Worker (ключ лежит там в секрете), ИИ доступен всем пользователям
  if (!key && CONFIG.WORKER_URL && tg && tg.initData) {
    try { return { text: (await workerApi('ai', { sys, user })).text, needKey: false }; } catch { return { text: '', needKey: false }; }
  }
  let text = '', needKey = !key;
  if (needKey) return { text, needKey };
  const headers = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key };
  for (const model of CONFIG.AI.MODELS) {
    try {
      const ac = new AbortController(); setTimeout(() => ac.abort(), 45000); // бесплатные модели бывают медленными
      const body = JSON.stringify({ model, messages: [{ role: 'system', content: sys }, { role: 'user', content: user }] });
      const res = await fetch(CONFIG.AI.ENDPOINT, { method: 'POST', headers, signal: ac.signal, body });
      if (res.status === 401 || res.status === 402) { needKey = true; break; }
      if (!res.ok) continue; // 403/429/5xx у конкретной модели — пробуем следующую бесплатную
      const j = await res.json();
      text = j.choices?.[0]?.message?.content || '';
      if (/api key|budget|insufficient credits/i.test(text)) { needKey = true; text = ''; break; }
      if (text) break;
    } catch { }
  }
  return { text, needKey };
}

// мини-график: 60 последних закрытых минутных свечей + Bollinger(20, 2), рассчитанный по каждой точке
function chartSvg(c1) {
  if (!c1 || c1.length < 80) return '';
  const N = 60, W = 340, H = 150, P = 4, closes = c1.map(c => c.c), from = c1.length - N;
  const bands = [];
  for (let i = from; i < c1.length; i++) bands.push(Indicators.bollinger(closes.slice(0, i + 1), 20, 2));
  const view = c1.slice(from);
  const lo = Math.min(...view.map(c => c.l), ...bands.map(b => b.lower)), hi = Math.max(...view.map(c => c.h), ...bands.map(b => b.upper));
  const y = v => P + (hi - v) / ((hi - lo) || 1) * (H - 2 * P), step = W / N, bw = Math.max(1.5, step * 0.6);
  const line = k => bands.map((b, i) => `${(i * step + step / 2).toFixed(1)},${y(b[k]).toFixed(1)}`).join(' ');
  const candles = view.map((c, i) => {
    const x = i * step + step / 2, up = c.c >= c.o, top = y(Math.max(c.o, c.c)), h = Math.max(1, Math.abs(y(c.o) - y(c.c)));
    return `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${y(c.h).toFixed(1)}" y2="${y(c.l).toFixed(1)}" class="${up ? 'su' : 'sd'}"/><rect x="${(x - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" class="${up ? 'fu' : 'fd'}"/>`;
  }).join('');
  const last = y(view.at(-1).c);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="chart">
    <polygon points="${line('upper')} ${bands.map((b, i) => `${(i * step + step / 2).toFixed(1)},${y(b.lower).toFixed(1)}`).reverse().join(' ')}" class="bbz"/>
    <polyline points="${line('upper')}" class="bbl"/><polyline points="${line('lower')}" class="bbl"/><polyline points="${line('mid')}" class="bbm"/>
    ${candles}<line x1="0" x2="${W}" y1="${last.toFixed(1)}" y2="${last.toFixed(1)}" class="lastl"/></svg>`;
}

/* ═════════════════════════ САМОПРОВЕРКА ═════════════════════════ */
function runUnitTests() {
  const T = [], near = (a, b, e) => Math.abs(a - b) <= e;
  const ws = [44.3389, 44.0902, 44.1497, 43.6124, 44.3278, 44.8264, 45.0955, 45.4245, 45.8433, 46.0826, 45.8931, 46.0328, 45.6140, 46.2820, 46.2820];
  const r1 = Indicators.rsi(ws, 14).at(-1);
  T.push(['RSI(14) эталон Уайлдера ≈ 70.53', near(r1, 70.53, 0.05), r1.toFixed(2)]);
  const up = Array.from({ length: 30 }, (_, i) => 100 + i), dn = up.slice().reverse();
  T.push(['RSI растущего ряда = 100', Indicators.rsi(up).at(-1) === 100, Indicators.rsi(up).at(-1)]);
  T.push(['RSI падающего ряда = 0', Indicators.rsi(dn).at(-1) === 0, Indicators.rsi(dn).at(-1)]);
  T.push(['RSI постоянного ряда = 50', Indicators.rsi(Array(30).fill(5)).at(-1) === 50, 50]);
  const b1 = Indicators.bollinger(Array.from({ length: 20 }, (_, i) => i + 1));
  T.push(['BB(1..20): mid 10.5', near(b1.mid, 10.5, 1e-9), b1.mid]);
  T.push(['BB(1..20): upper 22.033', near(b1.upper, 10.5 + 2 * Math.sqrt(399 / 12), 1e-9), b1.upper.toFixed(3)]);
  T.push(['BB(1..20): lower −1.033', near(b1.lower, 10.5 - 2 * Math.sqrt(399 / 12), 1e-9), b1.lower.toFixed(3)]);
  const b2 = Indicators.bollinger(Array(25).fill(7));
  T.push(['BB постоянного ряда: ширина 0', b2.upper === 7 && b2.lower === 7, `${b2.lower}/${b2.upper}`]);
  T.push(['EMA постоянного ряда = константа', Indicators.ema(Array(60).fill(3), 20).at(-1) === 3, 3]);
  T.push(['ВЫШЕ: выход > вход → ПЛЮС', Resolve.outcome('up', 1, 1.1) === 'win', Resolve.outcome('up', 1, 1.1)]);
  T.push(['ВЫШЕ: выход < вход → МИНУС', Resolve.outcome('up', 1, 0.9) === 'loss', Resolve.outcome('up', 1, 0.9)]);
  T.push(['НИЖЕ: выход < вход → ПЛЮС', Resolve.outcome('down', 1, 0.9) === 'win', Resolve.outcome('down', 1, 0.9)]);
  T.push(['НИЖЕ: выход > вход → МИНУС', Resolve.outcome('down', 1, 1.1) === 'loss', Resolve.outcome('down', 1, 1.1)]);
  T.push(['Равенство → ВОЗВРАТ', Resolve.outcome('up', 1, 1) === 'refund' && Resolve.outcome('down', 1, 1) === 'refund', 'refund']);
  const cs = [0, 1, 2].map(i => ({ t: 60000 * (10 + i), o: 10 + i, h: 0, l: 0, c: 10.5 + i }));
  const fr = Resolve.fromCandles({ dir: 'up', entryT: 600000, exp: 3 }, cs);
  T.push(['Вход = open следующей, выход = close последней', fr.entry === 10 && fr.exit === 12.5 && fr.outcome === 'win', `${fr.entry} → ${fr.exit}`]);
  T.push(['Нет свечи выхода → результата нет', Resolve.fromCandles({ dir: 'up', entryT: 600000, exp: 5 }, cs) === null, 'null']);
  return T;
}
function vSelftest() {
  const seed = +(new URLSearchParams(location.search).get('seed')) || (Date.now() % 1e9);
  const one = backtest(randomWalk(seed, 3000), 5);
  const agg = { signals: 0, win: 0, loss: 0, refund: 0 };
  for (let k = 1; k <= 30; k++) { const r = backtest(randomWalk(seed + k * 7919, 3000), 5); for (const x in agg) agg[x] += r[x]; }
  const line = r => { const n = r.win + r.loss, p = n ? r.win / n : 0, se = n ? Math.sqrt(0.25 / n) : 0; return { n, p, se, ok: n > 0 && Math.abs(p - 0.5) <= 2.6 * se }; };
  const L1 = line(one), L2 = line(agg), tests = runUnitTests();
  const okAll = tests.every(x => x[1]);
  return `<div class="card"><div class="label">Selftest · seed ${seed}</div>
    <p>Случайное блуждание, 3000 минутных свечей, экспирация 5 мин. Функциям на каждом шаге передаются только прошлые свечи.</p>
    <table class="t"><tr><td>Сигналов</td><td><b>${one.signals}</b> (ВЫШЕ/НИЖЕ)</td></tr>
    <tr><td>Плюс / минус / возврат</td><td>${one.win} / ${one.loss} / ${one.refund}</td></tr>
    <tr><td>Винрейт</td><td><b>${pct(L1.p)}</b> ± ${(L1.se * 196).toFixed(1)}% (95%)</td></tr></table>
    <p class="note mt">Контроль: 30 прогонов × 3000 свечей → сигналов ${agg.signals}, винрейт <b>${pct(L2.p)}</b> ± ${(L2.se * 196).toFixed(1)}% —
    <span class="${L2.ok ? 'pass' : 'fail'}">${L2.ok ? 'около 50%, заглядывания вперёд нет' : 'отклонение от 50% — проверьте логику'}</span></p></div>
    <div class="card"><div class="label">Юнит-проверки · <span class="${okAll ? 'pass' : 'fail'}">${tests.filter(x => x[1]).length}/${tests.length}</span></div>
    <table class="t">${tests.map(([n, ok, v]) => `<tr><td>${esc(n)}</td><td class="${ok ? 'pass' : 'fail'}">${ok ? 'OK' : 'FAIL'}</td><td class="note">${esc(v)}</td></tr>`).join('')}</table></div>
    <a class="btn ghost" href="?selftest=1">Ещё прогон</a>`;
}

/* ═════════════════════════ РЕНДЕР И СОБЫТИЯ ═════════════════════════ */
function render() {
  document.documentElement.lang = S.lang;
  $('#appName').textContent = CONFIG.APP_NAME;
  document.title = CONFIG.APP_NAME;
  $('#tagline').textContent = t('tagline');
  $('#btnLang').textContent = S.lang === 'ru' ? 'EN' : 'RU';
  renderSteps(); renderFoot();
  const v = { select: vSelect, signal: vSignal, result: vResult, history: vHistory, how: vHow, day: vDay, admin: isAdmin ? vAdmin : vSelect, scan: vScan, selftest: vSelftest }[S.screen] || vSelect;
  $('#view').innerHTML = v();
  if (tg && tg.BackButton) S.screen === 'select' ? tg.BackButton.hide() : tg.BackButton.show();
  tick();
}
function goBack() { S.screen = S.screen === 'result' && S.an && S.an.status === 'ok' ? 'signal' : 'select'; render(); }
function tick() {
  const now = Date.now();
  document.querySelectorAll('[data-deadline]').forEach(el => {
    const left = +el.dataset.deadline - now;
    el.classList.toggle('exp', left <= 0);
    el.textContent = left > 0 ? `${t('window')}: ${mmss(left)}` : t('windowOut');
  });
  // автопоиск: раз в минуту, через 3 с после закрытия свечи
  if (S.screen === 'scan' && S.scan && S.scan.auto && !S.scan.running && new Date(now).getSeconds() >= 3 && S.scan.lastMin !== Math.floor(now / 60000)) {
    S.scan.lastMin = Math.floor(now / 60000); scanAll();
  }
  if (watchOn() && new Date(now).getSeconds() >= 4 && S.watchMin !== Math.floor(now / 60000)) {
    S.watchMin = Math.floor(now / 60000); watchRun();
  }
  // автопостинг без сервера: раз в минуту, пока приложение открыто у админа
  if (autoLocalOn() && new Date(now).getSeconds() >= 3 && S.autoMin !== Math.floor(now / 60000)) {
    S.autoMin = Math.floor(now / 60000); autoLocalRun();
  }
  let rerender = false;
  document.querySelectorAll('[data-due]').forEach(el => { const left = +el.dataset.due - now; el.textContent = mmss(left); if (left <= 0) rerender = true; });
  if (rerender) render();
}
setInterval(tick, 1000);
setInterval(() => resolvePending(false), 5000);
setInterval(() => { if (S.screen === 'select') render(); }, 60000);

document.addEventListener('click', async e => {
  const b = e.target.closest('button,a'); if (!b) return;
  const ds = b.dataset;
  if (ds.go) { S.screen = ds.go; if (ds.go === 'result') resolvePending(true); if (ds.go === 'scan') scanAll(); return render(); }
  if (ds.scanopen) { $('#banner').classList.remove('show'); const a = ASSET[ds.scanopen]; S.assetId = a.id; S.cls = a.cls; return runAnalysis(); }
  if (ds.ap) { S.ap = ds.ap; return render(); }
  if (ds.bcdraft) {
    const g = draftGroups().find(x => x.key === ds.bcdraft); if (!g) return;
    const n = SUBS.get().filter(s => s.id !== g.chat).length;
    if (!(await confirmBox(t('bcConfirmMedia', { k: t('kind_' + g.kind), n })))) return;
    return broadcast(null, g);
  }
  if (ds.rmid) {
    const id = +ds.rmid;
    if (CONFIG.WORKER_URL && S.worker && S.worker.data && S.worker.data.kv) {
      try { S.worker.data.access = (await workerApi('revoke', { id })).access; toast(t('revoked')); } catch (err) { toast(err.message); }
    } else S.idsDraft = S.idsDraft.filter(x => x !== id);
    return render();
  }
  if (ds.cls) { S.cls = ds.cls; const f = ASSETS.find(a => a.cls === ds.cls && isOpen(a.cls) && !assetLocked(a)) || ASSETS.find(a => a.cls === ds.cls); S.assetId = f.id; if (ds.cls === 'stocks' && S.stockRT === 'unknown') checkStocksRealtime(); return render(); }
  if (ds.asset) { S.assetId = ds.asset; return render(); }
  if (ds.exp) { S.exp = +ds.exp; return render(); }
  if (ds.hcls) { S.hf.cls = ds.hcls; return render(); }
  if (ds.hper) { S.hf.period = ds.hper; return render(); }
  const id = ds.id ? +ds.id : null, rec = id ? Store.get(id) : null;
  switch (ds.act) {
    case 'analyze': return runAnalysis();
    case 'ai': return aiExplain();
    case 'ailean': return aiLean();
    case 'watch': LS.set('ta_watch', !watchOn()); S.watchMin = null; beep(); return render(); // звук по нажатию разблокирует аудио в WebView
    case 'bannerclose': return $('#banner').classList.remove('show');
    case 'notifysubs': LS.set('ta_notify_subs', !LS.get('ta_notify_subs', false)); return render();
    case 'manual': return publishManual(ds.dir);
    case 'ref': return openExternal(refLink());
    case 'help': return openTg(supportLink());
    case 'copyid': if (tgUser) copyText(String(tgUser.id)); return;
    case 'resolve': return resolvePending(true);
    case 'post': if (rec) { await postToChannel(postSignalText(rec)); Store.patch(id, { posted: true }); render(); } return;
    case 'copy': if (rec) copyText(postSignalText(rec)); return;
    case 'postres': if (rec) { await postToChannel(postResultText(rec)); Store.patch(id, { resultPosted: true }); render(); } return;
    case 'copyres': if (rec) copyText(postResultText(rec)); return;
    case 'clear': if (await confirmBox(t('clearQ'))) { Store.clear(); AIStore.clear(); S.currentId = null; render(); } return;
    case 'postday': { const n = dayList().filter(r => !r.resultPosted).length; if (n && !(await confirmBox(t('dayWarn', { n })))) return; await postToChannel(dayText()); return; }
    case 'copyday': return copyText(dayText());
    case 'reftest': if (refValid(S.refDraft)) openExternal(buildRef(S.refDraft.url, S.refDraft.param, 'test')); return;
    case 'copysettings': return copyText(settingsJson());
    case 'ghedit': return openExternal(`https://github.com/${CONFIG.GITHUB_REPO}/edit/main/settings.json`);
    case 'copysrc': return copyText(appLink(cleanSub(S.srcSub)));
    case 'scan': return scanAll();
    case 'scanauto': if (S.scan) { S.scan.auto = !S.scan.auto; S.scan.lastMin = Math.floor(Date.now() / 60000); } return render();
    case 'addid': {
      const el = document.getElementById('admId'), nid = Number((el && el.value || '').trim());
      if (!Number.isSafeInteger(nid) || nid <= 0) return toast(t('badId'));
      if (CONFIG.WORKER_URL && S.worker && S.worker.data && S.worker.data.kv) {
        try { S.worker.data.access = (await workerApi('grant', { id: nid })).access; toast(t('granted')); } catch (err) { toast(err.message); }
      } else if (!S.idsDraft.includes(nid)) { S.idsDraft.push(nid); toast(t('grantedDraft')); }
      return render();
    }
    case 'aikeysave': {
      const k = (document.getElementById('aiKeyInp').value || '').trim();
      if (!/^sk-or-v1-[a-f0-9]{40,}$/.test(k)) return toast(t('aiBadKey'));
      LS.set('ta_ai_key', k); S.ai = {}; S.aiLean = {}; toast(t('botSaved')); return render();
    }
    case 'aikeyforget': LS.set('ta_ai_key', ''); return render();
    case 'botsave': {
      const tok = (document.getElementById('botToken').value || '').trim(), ch = (document.getElementById('botChannel').value || '').trim();
      if (ch && !/^(@[A-Za-z0-9_]{4,}|-100\d{5,})$/.test(ch)) return toast(t('botBadChannel'));
      if (tok) {
        if (!/^\d+:[\w-]{30,}$/.test(tok)) return toast(t('botBadToken'));
        try { const me = await botApi('getMe', {}, tok); BOT.set({ token: tok, name: me.username }); }
        catch (err) { return toast(t('botCheckFail', { e: err.message })); }
      }
      BOT.set({ channel: ch }); S.subSync = null; toast(t('botSaved')); return render();
    }
    case 'bottest': try { await botSend(BOT.get().channel, t('testPost')); toast(t('sentBot')); } catch (err) { toast(t('sendFail', { e: err.message })); } return;
    case 'botforget': if (await confirmBox(t('botForgetQ'))) { LS.set('ta_bot', { token: '', channel: BOT.get().channel, name: '' }); LS.set('ta_autolocal', false); render(); } return;
    case 'autolocal': LS.set('ta_autolocal', !LS.get('ta_autolocal', false)); S.autoMin = null; return render();
    case 'subsync': return syncSubscribers();
    case 'welcomesave': LS.set('ta_welcome', (document.getElementById('welcomeTxt').value || '').trim() || t('welcomeDefault')); return toast(t('botSaved'));
    case 'bcsend': {
      const txt = (document.getElementById('bcTxt').value || '').trim(), n = SUBS.get().length;
      if (!txt) return toast(t('bcEmpty'));
      if (!(await confirmBox(t('bcConfirm', { n })))) return;
      return broadcast(txt);
    }
    case 'wreload': return loadWorkerStatus();
    case 'wauto': try { await workerApi('setAuto', { on: !S.worker.data.auto }); } catch (err) { toast(err.message); } return loadWorkerStatus();
    case 'wtest': try { await workerApi('post', { text: t('testPost') }); toast(t('sentBot')); } catch (err) { toast(err.message); } return;
    case 'wday': try { await workerApi('postDay'); toast(t('sentBot')); } catch (err) { toast(err.message); } return;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'refUrl') S.refDraft.url = el.value.trim();
  else if (el.id === 'refParam') S.refDraft.param = el.value.trim();
  else if (el.id === 'srcSub') S.srcSub = el.value.trim();
  else return;
  updateRefPreview();
});
$('#btnLang').onclick = () => { S.lang = S.lang === 'ru' ? 'en' : 'ru'; LS.set('ta_lang', S.lang); render(); };
$('#btnHelp').onclick = () => openTg(supportLink());

// экспорт чистых функций для внешних тестов
window.TA = { Indicators, Signal, Resolve, aggregate, randomWalk, backtest };

applyTheme();
if (new URLSearchParams(location.search).get('selftest') === '1') S.screen = 'selftest';
render();
if (S.screen !== 'selftest') { loadSettings().then(checkStocksRealtime); checkWorkerAccess(); resolvePending(true); }
